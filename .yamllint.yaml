---
# yamllint configuration (used by .github/workflows/pr-checks.yaml).
extends: default

ignore: |
  .git/

rules:
  line-length:
    max: 120
    level: warning
  # GitHub Actions uses the bare key `on:`, which yamllint reads as a boolean.
  truthy:
    allowed-values: ['true', 'false']
    check-keys: false
  comments:
    min-spaces-from-content: 1
  document-start: disable
