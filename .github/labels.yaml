---
# Declarative label set, applied by .github/workflows/labels-sync.yaml.
# Colors are 6-digit hex WITHOUT '#'. The sync runs with skip-delete, so a
# label removed from this file is NOT deleted from the repository; delete it
# by hand if that is really intended.

# ── Type ───────────────────────────────────────────────────────────────────
- name: bug
  color: d73a4a
  description: Something isn't working
- name: enhancement
  color: a2eeef
  description: New feature or request
- name: documentation
  color: 0075ca
  description: Improvements or additions to documentation
- name: refactor
  color: 84cc16
  description: Code change with no behavior change
- name: test
  color: fbca04
  description: Tests or test infrastructure
- name: ci
  color: 5319e7
  description: CI workflows and repository automation
- name: security
  color: e11d48
  description: Security-related change
- name: release
  color: 0e8a16
  description: Versioning, changelog and published artifacts

# ── Ecosystem (also applied by Dependabot) ─────────────────────────────────
- name: dependencies
  color: 0366d6
  description: Pull requests that update a dependency file
- name: github_actions
  color: '000000'
  description: Pull requests that update GitHub Actions code
- name: docker
  color: 21ceff
  description: Pull requests that update docker code

# ── Triage ─────────────────────────────────────────────────────────────────
- name: accessibility
  color: f143ab
  description: Barrier affecting people with disabilities
- name: duplicate
  color: cfd3d7
  description: This issue or pull request already exists
- name: good first issue
  color: 7057ff
  description: Good for newcomers
- name: help wanted
  color: '008672'
  description: Extra attention is needed
- name: invalid
  color: e4e669
  description: This doesn't seem right
- name: question
  color: d876e3
  description: Further information is requested
- name: wontfix
  color: ffffff
  description: This will not be worked on
